# ─────────────────────────────────────────────────────────────
#  Gruvbox-flame tmux: pill status bar matching p10k + fastfetch
#  colours: 208 orange · 214 yellow · 108 aqua · 109 blue · 142 green
#           167 red · 223 cream · 238/235 greys
# ─────────────────────────────────────────────────────────────

# ── core ─────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g escape-time 10
set -g focus-events on
set -g mouse on
setw -g mode-keys vi
set-option -g set-clipboard on

# ── quality of life ──────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# ── Keybindings ──
# Prefix is Ctrl-Space. Real Ctrl-a / Ctrl-b stay free for the shell and editors.
unbind C-b
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix

bind | split-window -h -c "#{pane_current_path}"   # | = side by side
bind - split-window -v -c "#{pane_current_path}"   # - = stacked
bind c new-window -c "#{pane_current_path}"
bind a select-pane -L              # WASD pane movement
bind s select-pane -D
bind w select-pane -U
bind d select-pane -R
bind -r C-a resize-pane -L 2       # Ctrl+WASD after the prefix resizes (repeatable)
bind -r C-s resize-pane -D 2
bind -r C-w resize-pane -U 2
bind -r C-d resize-pane -R 2
bind D detach-client               # d is pane-right now, so detach is Shift-d
bind W choose-tree -w              # window list (was w)
bind S choose-tree -s              # session list (was s)
# Ctrl+Left/Right jump words: tmux hands the shell Esc-b / Esc-f
bind -n C-Left  send-keys M-b
bind -n C-Right send-keys M-f

# ── status bar: floating pills on the terminal background ────
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-style "bg=default,fg=colour223"
set -g status-left-length 40
set -g status-right-length 120

# session pill: orange, turns red while the prefix key is held
set -g status-left "#[fg=#{?client_prefix,colour167,colour208},bg=default]#[fg=colour235,bg=#{?client_prefix,colour167,colour208},bold]  #S #[fg=#{?client_prefix,colour167,colour208},bg=default,nobold] "

# window pills: grey inactive, aqua active (zoom shows a magnifier)
setw -g window-status-separator " "
setw -g window-status-format "#[fg=colour238,bg=default]#[fg=colour223,bg=colour238] #I #W #[fg=colour238,bg=default]"
setw -g window-status-current-format "#[fg=colour108,bg=default]#[fg=colour235,bg=colour108,bold] #I #W#{?window_zoomed_flag, ,} #[fg=colour108,bg=default,nobold]"

# right pills: host · battery · date · time
set -g status-right "#[fg=colour109,bg=default]#[fg=colour235,bg=colour109]  #h #[fg=colour109,bg=default] #[fg=colour142,bg=default]#[fg=colour235,bg=colour142]  #{?#{e|>:#(cat /sys/class/power_supply/BAT0/capacity),100},100,#(cat /sys/class/power_supply/BAT0/capacity)}% #[fg=colour142,bg=default] #[fg=colour238,bg=default]#[fg=colour223,bg=colour238]  %a %d %b #[fg=colour238,bg=default] #[fg=colour214,bg=default]#[fg=colour235,bg=colour214,bold]  %H:%M #[fg=colour214,bg=default,nobold]"

# ── panes, messages, copy mode ───────────────────────────────
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour108"
set -g message-style "bg=colour238,fg=colour214"
set -g message-command-style "bg=colour238,fg=colour108"
setw -g mode-style "bg=colour214,fg=colour235"
set -g display-panes-colour colour238
set -g display-panes-active-colour colour208
setw -g clock-mode-colour colour208
